name: Commit ignore request

# When someone opens an issue from the report's "Commit to ignore.txt" button,
# parse it and append the rules to ignore.txt on main, then close the issue.
# Only issues from the repo owner / members / collaborators are acted on, and
# only when they carry the LinkChecker marker — ordinary issues are ignored.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: ignore-commit
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    if: >-
      contains(github.event.issue.body, '<!-- linkchecker-ignore -->') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply ignore rules from issue
        id: apply
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IGNORE_FILE: ignore.txt
        run: python scripts/ingest_ignore_issue.py

      - name: Commit changes
        if: steps.apply.outputs.added != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ignore.txt
          git commit -m "Ignore rules from issue #${{ github.event.issue.number }}"
          git push origin HEAD:main

      - name: Comment and close issue
        uses: actions/github-script@v7
        env:
          LC_MESSAGE: ${{ steps.apply.outputs.message }}
        with:
          script: |
            const message = process.env.LC_MESSAGE || 'Processed.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
